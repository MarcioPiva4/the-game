<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <script src="anime.min.js" defer></script>
  <title>The Game</title>
</head>

<body>
  <audio id="backgroundMusic" autoplay loop>
    <source src="music.mp3" type="audio/mpeg" >
  </audio>

  <section class="game-section-menu">
    <h1 class="title">The Game</h1>
    <div class="game-menu">
      <ul>
        <input type="text" name="name" id="name" placeholder="seu nome">
        <li id="play">Jogar</li>
        <li id="config">Configurações</li>
      </ul>
    </div>

    <p>Max e min: 2 jogadores</p>
    <p>Conectado(s): <span class="connects">carregando...</span></p>
    <p>Espectador(es): <span class="players">carregando...</span></p>
  </section>

  <section class="game-section-menu-config">
    <h1 class="title-config">Configurações</h1>
    <div class="content-config">
      <label for="volumeControl" class="label-volume">
        <p>Volume</p>
        <button id="volume-mute">
          <svg width="20" height="20" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 1H8V15H6L2 11H0V5H2L6 1Z" fill="#ffff"/>
            <path d="M14 8C14 5.79086 12.2091 4 10 4V2C13.3137 2 16 4.68629 16 8C16 11.3137 13.3137 14 10 14V12C12.2091 12 14 10.2091 14 8Z" fill="#fff"/>
            <path d="M12 8C12 9.10457 11.1046 10 10 10V6C11.1046 6 12 6.89543 12 8Z" fill="#fff"/>
          </svg> 
          <svg width="20" height="20" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" class="disable">
            <path d="M8 1H6L2 5H0V11H2L6 15H8V1Z" fill="#fff"/>
            <path d="M9.29289 6.20711L11.0858 8L9.29289 9.79289L10.7071 11.2071L12.5 9.41421L14.2929 11.2071L15.7071 9.79289L13.9142 8L15.7071 6.20711L14.2929 4.79289L12.5 6.58579L10.7071 4.79289L9.29289 6.20711Z" fill="#fff"/>
          </svg>
        </button>
        <input id="volumeControl" type="range" min="0" max="1" step="0.01" value="1"/>
      </label>

      <button id="back">Voltar</button>
    </div>
  </section>

  <section class="game-section">
    <div class="game">
      <div class="player-1">
        <p class="name-player-1"></p>
      </div>

      <div class="player-2">
        <p class="name-player-2"></p>
      </div>
    </div>

    <div class="bar-informations">
      <p class="time"><span>00</span> : <span>00</span></p>
    </div>
  </section>

  <script>
    const buttonPlay = document.querySelector('#play');
    const buttonConfig = document.querySelector('#config');
    const buttonBack = document.querySelector('#back');
    const player1 = document.querySelector('.player-1');
    const player2 = document.querySelector('.player-2');
    const namePlayer1 = document.querySelector('.name-player-1');
    const namePlayer2 = document.querySelector('.name-player-2');
    const time = document.querySelector('.time');
    // Conectar ao WebSocket do servidor
    const socket = new WebSocket('ws://localhost:3000');
    sessionStorage.clear();

    let player = JSON.parse(sessionStorage.getItem('player'));
    let gameStart;

    let positionX = 0;
    let positionY = 0;
    let speed = 20;
    let isMoving = false;
    let isEspectation;
    // Evento quando a conexão é aberta
    socket.addEventListener('open', function (event) {
      console.log('Conectado ao WebSocket');
    });

    // Evento quando uma mensagem é recebida
    socket.addEventListener('message', function (event) {
      const data = JSON.parse(event.data);
      if (data.type == 'time') {
        let timeData = data.time;
        let minutes = Math.floor(timeData / 60);
        let seconds = timeData % 60;
        time.innerHTML = `<span>${minutes.toString().length == 1 ? '0' + minutes : minutes}</span> : <span>${seconds.toString().length == 1 ? '0' + seconds : seconds}</span>`;
      }

      if (data.player && data.type == 'player') {
        player = data.player;
        if (sessionStorage.getItem('player')) {
          sessionStorage.removeItem('player');
        }
        sessionStorage.setItem('player', JSON.stringify(data));
      }
      document.querySelector('.connects').textContent = data.totalPlayers

      if (data.type == 'espec') {
        isEspectation = true;
      }

      if (isEspectation && data.movement !== undefined && data.movement.type == 'movement') {
        const playersArray = Object.keys(data.movement.players);
        playersArray.forEach((e) => {
          const players = data.movement.players[e];
          if (players.player == 1) {
            player1.style.left = `${players.x}px`
            player1.style.top = `${players.y}px`
          }

          if (players.player == 2) {
            player2.style.top = `${players.y}px`
            player2.style.right = `${players.x}px`
          }
        })
      }

      if (data.type == 'game' && player || isEspectation) {
        gameStart = data.gameStart;
        const players = Object.entries(data.players);

        players.forEach(([key, value]) => {
          console.log(value.nome)
          value.player === 1 ? namePlayer1.textContent = value.nome : namePlayer2.textContent = value.nome;
        })
      }


      const isPlayer = player && player.player == 1 ? player1 : player2;
      if (gameStart) {
        function sendPosition(positionX, positionY) {
          socket.send(JSON.stringify({
            id: player.id,
            player: player.player,
            type: 'movement',
            positionX,
            positionY
          }));
        }
        document.querySelector('.game-section-menu').classList.add('hidden-animation-top');
        document.querySelector('.game-section').style.display = 'block';
        if (!isEspectation) {
          document.addEventListener('keydown', function (e) {
            if (!isMoving) {
              isMoving = true;
              if (e.key === 'w') {
                positionY -= speed;
                isPlayer.style.top = `${positionY}px`;
                sendPosition(positionX, positionY);
              };
              if (e.key === 's') {
                positionY += speed;
                isPlayer.style.top = `${positionY}px`;
                sendPosition(positionX, positionY);
              };
              if (e.key === 'a') {
                if (player.player == 1) {
                  positionX -= speed;
                  isPlayer.style.left = `${positionX}px`
                  sendPosition(positionX, positionY);
                } else {
                  positionX += speed;
                  isPlayer.style.right = `${positionX}px`
                  sendPosition(positionX, positionY);
                }
              };
              if (e.key === 'd') {
                if (player.player == 1) {
                  positionX += speed;
                  isPlayer.style.left = `${positionX}px`
                  sendPosition(positionX, positionY);
                } else {
                  positionX -= speed;
                  isPlayer.style.right = `${positionX}px`
                  sendPosition(positionX, positionY);
                }
              };
            }
          })
          document.addEventListener('keyup', function (e) {
            if (e.key === 'w' || e.key === 's' || e.key === 'a' || e.key === 'd') {
              isMoving = false;
            }
          });
        }
      }

      if (!gameStart) {
        document.querySelector('.game-section-menu').classList.remove('hidden-animation-top');
        document.querySelector('.game-section').style.display = 'none';
      }

      if (data.movement !== undefined && data.movement.type == 'movement' && player) {
        const playersArray = Object.keys(data.movement.players);
        const playersArrayFiltered = playersArray.filter((e) => e != player.id);
        if (playersArrayFiltered[0] !== player.id) {
          const otherPlayer = data.movement.players[playersArrayFiltered[0]];
          if (otherPlayer !== undefined && otherPlayer.player === 1) {
            player1.style.left = `${otherPlayer.x}px`
            player1.style.top = `${otherPlayer.y}px`
          }

          if (otherPlayer !== undefined && otherPlayer.player === 2) {
            player2.style.top = `${otherPlayer.y}px`
            player2.style.right = `${otherPlayer.x}px`
          }
        }
      }
    });

    window.addEventListener('beforeunload', () => {
      socket.send(JSON.stringify({
        type: 'disconnect',
        id: player.id,
      }));
    });

    socket.addEventListener('close', function () {
      socket.send(JSON.stringify({
        type: 'disconnect',
        id: player.id,
      }));
    })

    buttonPlay.addEventListener('click', function () {
      const name = document.querySelector('#name').value;
      if (!player) {
        if (name.length <= 0) {
          window.alert('Por favor insira um nome');
          return
        }
        socket.send(JSON.stringify({
          type: 'connect',
          name,
        }));
      }
    });

    buttonConfig.addEventListener('click', function() {
      document.querySelector('.game-section-menu').style.display = 'none';
      document.querySelector('.game-section-menu-config').style.display = 'block';
    });

    buttonBack.addEventListener('click', function(){
      document.querySelector('.game-section-menu').style.display = 'block';
      document.querySelector('.game-section-menu-config').style.display = 'none';
    });

    document.addEventListener('click', function () {
      const gameDiv = document.querySelector('.game');
      const isPlayer = player && player.player == 1 ? player1 : player2;
      const positionBottom = isPlayer.classList.contains('player-1') ? isPlayer.getBoundingClientRect().bottom : isPlayer.getBoundingClientRect().bottom;
      const positionTop = isPlayer.classList.contains('player-1') ? isPlayer.getBoundingClientRect().top + 40 : isPlayer.getBoundingClientRect().top + 40;
      const positionRight = isPlayer.getBoundingClientRect().right;
      const positionLeft = isPlayer.classList.contains('player-1') ? isPlayer.getBoundingClientRect().left + 105 : isPlayer.getBoundingClientRect().left - 23;

      const element = document.createElement('div');
      isPlayer.classList.contains('player-1') ? element.classList.add('projectile-1') : element.classList.add('projectile-2');
      element.style.right = `${positionRight}px`;
      element.style.left = `${positionLeft}px`;
      element.style.top = `${positionTop}px`;
      element.style.bottom = `${positionBottom}px`;
      gameDiv.append(element);
      isPlayer.classList.contains('player-1') ? 
      anime({
        targets: element,
        translateX: 1000,
        duration: 1500, 
        easing: 'linear',
        complete: function () {
          gameDiv.removeChild(element);
        }
      })
      :
      anime({
        targets: element,
        translateX: -1050,
        duration: 1500,
        easing: 'linear',
        complete: function () {
          gameDiv.removeChild(element);
        }
      });
    });

    document.addEventListener('DOMContentLoaded', function(){
      const title = document.querySelector('.title');
      const text = title.innerText;
      title.innerHTML = '';

      text.split('').forEach(letter => {
        const span = document.createElement('span');
        span.innerText = letter;
        span.classList.add('letter');
        title.appendChild(span);
      });

      anime({
        targets: '.letter',
        opacity: [0, 1],
        scale: [0.5, 1], 
        color: ['#e74c3c', '#fff'],
        duration: 1000,
        easing: 'easeOutQuad', 
        delay: anime.stagger(100, {start: 500}),
      });
    });
  </script>


<script>
  const audio = document.getElementById('backgroundMusic');
  const buttonMute = document.getElementById('volume-mute');
  const barAudio = document.getElementById('volumeControl');
  const svgs = buttonMute.querySelectorAll('svg');

  function togglePlayPause() {
    if (audio.paused) {
      audio.play();
    } else {
      audio.pause();
    }
  }

  function changeVolume(volume) {
    audio.volume = volume;
    const localStorageSom = localStorage.getItem('som');
    if(!localStorageSom){
      localStorage.setItem('som', volume);
    } 

    if(localStorageSom && JSON.parse(localStorageSom) !== volume){
      localStorage.removeItem('som');
      localStorage.setItem('som', volume);
    }
  }

  function toggleVolumeSvg(){
    svgs[0].classList.toggle('disable');
    svgs[1].classList.toggle('active');
  }

  function muteVolumeSvg(){
    svgs[0].classList.add('disable');
    svgs[0].classList.remove('active');
    svgs[1].classList.add('active');
    svgs[1].classList.remove('disable');
  }

  function unmuteVolumeSvg(){
    svgs[0].classList.add('active');
    svgs[0].classList.remove('disable');
    svgs[1].classList.add('disable');
    svgs[1].classList.remove('active');
  }

  function muteAudio(){
    audio.pause();
    muteVolumeSvg();
  }

  function unmuteAudio(){
    audio.play();
    unmuteVolumeSvg();
  }

  barAudio.addEventListener('change', function() {
    changeVolume(this.value);
    if(this.value == 0){
      muteAudio();
    }

    if(this.value > 0){
      unmuteAudio();
    }
  });

  document.addEventListener('DOMContentLoaded', function(){
    if(localStorage.getItem('som')){
      const value = JSON.parse(localStorage.getItem('som'));
      barAudio.value = value;
      audio.volume = value;
      if(value == 0){
        muteVolumeSvg();
      } 
    };
  });

  // buttonMute.addEventListener('click', function() {
  //   togglePlayPause();
  //   toggleVolumeSvg();
  // });
</script>
</body>

</html>
